services:
  backend:
    build: .
    container_name: membership_backend  
    restart: always
    ports:
      - "3001:3001"
    environment:
      # Redis
      REDIS_HOST: membership_redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Postgres
      DATABASE_URL: postgres://kakoba:kakoba123@membership_postgres:5432/membership
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:15
    restart: always
    container_name: membership_postgres
    environment:
      POSTGRES_USER: kakoba
      POSTGRES_PASSWORD: kakoba123
      POSTGRES_DB: membership
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: always
    container_name: membership_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
